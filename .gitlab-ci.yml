# GitLab CI/CD Pipeline - AWS SaaS Multi-Tenant Bedrock Accelerator
# Architecture Hexagonale & TDD Quality Gates (0 Token Cost)

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"

cache:
  paths:
    - .cache/pip

image: python:3.11-slim

before_script:
  - python --version
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

lint:
  stage: lint
  script:
    - ruff check .

test:
  stage: test
  script:
    - pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=90
  coverage: '/TOTAL.+?([0-9]{1,3}%)/'
