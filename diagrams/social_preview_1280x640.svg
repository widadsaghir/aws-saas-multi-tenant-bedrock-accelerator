<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Gradients d'arrière-plan -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <radialGradient id="glowBlue" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowOrange" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowGreen" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Cartes Glassmorphism -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 38px; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 17px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
    .card-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.3px; }
    .card-tech { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; }
    .card-body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 13.5px; fill: #E2E8F0; }
    .footer-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12.5px; }
  </style>

  <!-- Fond Principal -->
  <rect width="1280" height="640" fill="url(#bgGradient)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect width="1280" height="640" fill="url(#glowBlue)" />
  <rect width="1280" height="640" fill="url(#glowOrange)" />
  <rect width="1280" height="640" fill="url(#glowGreen)" />

  <!-- EN-TÊTE / HEADER -->
  <g transform="translate(60, 48)">
    <!-- Capsule de statut -->
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="14" cy="14" r="5" fill="#38BDF8" />
    <text x="28" y="18" fill="#38BDF8" class="badge-text">AWS WELL-ARCHITECTED SAAS BLUEPRINT</text>

    <!-- Titre Principal -->
    <text x="0" y="70" class="title">AWS SaaS Multi-Tenant Bedrock Accelerator</text>
    
    <!-- Sous-titre Exécutif -->
    <text x="0" y="100" class="subtitle">Enclave IA Souveraine (eu-west-3 Paris) • Isolation Hybride Silo/Pool • Protocole MCP • Observabilité OpenTelemetry</text>
  </g>

  <!-- CARTES BENTO D'ARCHITECTURE (3 COLONNES) -->

  <!-- CARTE 1 : ISOLATION HYBRIDE SILO / POOL -->
  <g transform="translate(60, 180)" filter="url(#cardShadow)">
    <rect width="365" height="340" rx="16" fill="url(#cardGrad)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.7" />
    <rect width="365" height="5" rx="2" fill="#3B82F6" />
    
    <!-- Badge Catégorie -->
    <rect x="24" y="22" width="165" height="24" rx="6" fill="#1E3A8A" fill-opacity="0.6" stroke="#60A5FA" stroke-width="1" />
    <text x="34" y="38" fill="#93C5FD" class="badge-text">DATA ISOLATION</text>

    <text x="24" y="75" fill="#FFFFFF" class="card-title">Hybrid Multi-Tenancy</text>
    <text x="24" y="96" fill="#60A5FA" class="card-tech">Aurora PostgreSQL + AWS KMS CMK</text>

    <!-- Lignes de contenu avec icônes -->
    <g transform="translate(24, 125)">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="3" fill="#3B82F6" />
      <text x="18" y="10" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Silo Model :</tspan> Schémas DB isolés</text>
      <text x="18" y="28" fill="#94A3B8" font-size="12px">Clés KMS dédiées (Santé &amp; Notariat)</text>

      <!-- Item 2 -->
      <circle cx="6" cy="56" r="3" fill="#3B82F6" />
      <text x="18" y="60" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Pool Model :</tspan> Mutualisé optimisé</text>
      <text x="18" y="78" fill="#94A3B8" font-size="12px">Row-Level Security (RLS) par tenant</text>

      <!-- Item 3 -->
      <circle cx="6" cy="106" r="3" fill="#3B82F6" />
      <text x="18" y="110" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Compute :</tspan> Amazon EKS Graviton</text>
      <text x="18" y="128" fill="#94A3B8" font-size="12px">Injection JWT TenantContext étanche</text>

      <!-- Item 4 -->
      <circle cx="6" cy="156" r="3" fill="#3B82F6" />
      <text x="18" y="160" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Zéro Fuite :</tspan> Barrière mathématique</text>
      <text x="18" y="178" fill="#94A3B8" font-size="12px">Prouvée par tests d'isolation Silo/Pool</text>
    </g>
  </g>

  <!-- CARTE 2 : ENCLAVE IA SOUVERAINE & BEDROCK -->
  <g transform="translate(458, 180)" filter="url(#cardShadow)">
    <rect width="365" height="340" rx="16" fill="url(#cardGrad)" stroke="#EA580C" stroke-width="1.5" stroke-opacity="0.8" />
    <rect width="365" height="5" rx="2" fill="#EA580C" />

    <!-- Badge Catégorie -->
    <rect x="24" y="22" width="180" height="24" rx="6" fill="#7C2D12" fill-opacity="0.6" stroke="#FB923C" stroke-width="1" />
    <text x="34" y="38" fill="#FDBA74" class="badge-text">SOVEREIGN GENAI</text>

    <text x="24" y="75" fill="#FFFFFF" class="card-title">Amazon Bedrock Enclave</text>
    <text x="24" y="96" fill="#FB923C" class="card-tech">Claude 3.5 Sonnet (eu-west-3)</text>

    <g transform="translate(24, 125)">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="3" fill="#EA580C" />
      <text x="18" y="10" class="card-body"><tspan font-weight="700" fill="#FFFFFF">AWS PrivateLink :</tspan> Transit 100% privé</text>
      <text x="18" y="28" fill="#94A3B8" font-size="12px">Zéro transit sur l'Internet public</text>

      <!-- Item 2 -->
      <circle cx="6" cy="56" r="3" fill="#EA580C" />
      <text x="18" y="60" class="card-body"><tspan font-weight="700" fill="#FFFFFF">PII Sanitizer Local :</tspan> Air-Gap 0 Token</text>
      <text x="18" y="78" fill="#94A3B8" font-size="12px">Masquage NIR, IBAN, emails dans le pod</text>

      <!-- Item 3 -->
      <circle cx="6" cy="106" r="3" fill="#EA580C" />
      <text x="18" y="110" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Bedrock Guardrails :</tspan> Sécurité L7</text>
      <text x="18" y="128" fill="#94A3B8" font-size="12px">Filtre anti-prompt injection &amp; toxicité</text>

      <!-- Item 4 -->
      <circle cx="6" cy="156" r="3" fill="#EA580C" />
      <text x="18" y="160" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Zéro Rétention :</tspan> Données protégées</text>
      <text x="18" y="178" fill="#94A3B8" font-size="12px">Aucun réentraînement des modèles</text>
    </g>
  </g>

  <!-- CARTE 3 : PROTOCOLE MCP & OBSERVABILITÉ OPENTELEMETRY -->
  <g transform="translate(855, 180)" filter="url(#cardShadow)">
    <rect width="365" height="340" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8" />
    <rect width="365" height="5" rx="2" fill="#10B981" />

    <!-- Badge Catégorie -->
    <rect x="24" y="22" width="185" height="24" rx="6" fill="#064E3B" fill-opacity="0.6" stroke="#34D399" stroke-width="1" />
    <text x="34" y="38" fill="#6EE7B7" class="badge-text">MCP &amp; OBSERVABILITY</text>

    <text x="24" y="75" fill="#FFFFFF" class="card-title">Agent Tracing &amp; FinOps</text>
    <text x="24" y="96" fill="#34D399" class="card-tech">OpenTelemetry + CloudWatch + X-Ray</text>

    <g transform="translate(24, 125)">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="3" fill="#10B981" />
      <text x="18" y="10" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Protocole MCP :</tspan> Outils d'analyse</text>
      <text x="18" y="28" fill="#94A3B8" font-size="12px">Clause risk analyzer &amp; compliance</text>

      <!-- Item 2 -->
      <circle cx="6" cy="56" r="3" fill="#10B981" />
      <text x="18" y="60" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Traces Distribuées :</tspan> Spans OTel</text>
      <text x="18" y="78" fill="#94A3B8" font-size="12px">Traçabilité pas-à-pas du raisonnement</text>

      <!-- Item 3 -->
      <circle cx="6" cy="106" r="3" fill="#10B981" />
      <text x="18" y="110" class="card-body"><tspan font-weight="700" fill="#FFFFFF">FinOps SaaS :</tspan> Coût par Tenant</text>
      <text x="18" y="128" fill="#94A3B8" font-size="12px">Refacturation exacte des tokens consommés</text>

      <!-- Item 4 -->
      <circle cx="6" cy="156" r="3" fill="#10B981" />
      <text x="18" y="160" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Archi Hexagonale :</tspan> Ports &amp; Adapters</text>
      <text x="18" y="178" fill="#94A3B8" font-size="12px">Domaine découplé à 100% des SDKs Cloud</text>
    </g>
  </g>

  <!-- BANDEAU INFÉRIEUR / FOOTER KPI BADGES -->
  <g transform="translate(60, 545)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#38BDF8" class="footer-text">⚡ 16/16 Tests TDD (0.88s)</text>

    <!-- Pill 2 -->
    <rect x="205" y="0" width="180" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="221" y="22" fill="#34D399" class="footer-text">🛡️ Couverture Code 96%</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="195" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="416" y="22" fill="#FBBF24" class="footer-text">📦 Terraform IaC Modulaire</text>

    <!-- Pill 4 -->
    <rect x="610" y="0" width="170" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="626" y="22" fill="#A78BFA" class="footer-text">⚖️ Apache 2.0 Open Source</text>

    <!-- Signature Auteur -->
    <g transform="translate(845, 0)">
      <rect x="0" y="0" width="315" height="36" rx="8" fill="#1E293B" stroke="#F97316" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="16" y="22" fill="#FDBA74" class="footer-text">👤 Widad SAGHIR • Lead Solutions Architect</text>
    </g>
  </g>
</svg>